[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "aiosnmpswitch"
dynamic = ["version"]
description = "Async Python client for managed network switches over SNMP - ports, PoE, MAC address table and LLDP neighbours; read-only, typed, vendor-neutral"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "eizedev", email = "oss@eize.dev" }]
keywords = [
    "snmp", "switch", "network-switch", "managed-switch", "lldp", "poe", "mac-address-table",
    "hpe", "officeconnect", "instant-on", "asyncio", "home-assistant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# cryptography: pysnmp needs it for SNMPv3 privacy (DES, AES) but does not require it itself.
dependencies = ["pysnmp>=7.1.27", "cryptography>=44"]

[project.scripts]
aiosnmpswitch-diagnostics = "aiosnmpswitch.diagnostics:main"

[project.urls]
Homepage = "https://github.com/eizedev/aiosnmpswitch"
Documentation = "https://aiosnmpswitch.eize.dev/"
Issues = "https://github.com/eizedev/aiosnmpswitch/issues"
Changelog = "https://github.com/eizedev/aiosnmpswitch/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aiosnmpswitch/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "scripts", "docs", "README.md", "CHANGELOG.md", "AGENTS.md", "LICENSE",
    "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "build-constraints.txt", "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["aiosnmpswitch"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# pysnmp ships no type information.
module = ["pysnmp.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT", "C4", "PL", "D"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLR0913", # the transport constructor takes the documented connection options
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "S105", "S106"]
"scripts/**" = ["D", "T201", "S603", "S607"]

[tool.uv]
# The uv CI uses (setup-uv reads it); a range, so patch releases come without a change here.
required-version = ">=0.13.5,<0.14"
